# ====================================================================
# APEX BANKING CORP — SPRING BOOT APPLICATION CONFIGURATION
# ====================================================================

# Server Configuration
server.port=8080
spring.application.name=banking-management-system

# MySQL Database Default Credentials
spring.datasource.url=jdbc:mysql://localhost:3306/banking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Enable H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Jackson JSON Settings
spring.jackson.serialization.indent-output=true
